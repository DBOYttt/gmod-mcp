[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmod-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0",
    "watchdog>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
gr-mcp = "gr_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["gr_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
